name: Deploy Astro site to Pages

on:
  # Build and deploy on every push to main
  push:
    branches: [main]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Permissions required by actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time. Don't cancel in-progress deploys.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build with Astro
        uses: withastro/action@v6.1.1
        with:
          # Match local dev Node version. Astro 6 requires Node >= 22.12.
          node-version: '22'
          # Use our package script so Pagefind runs after `astro build`.
          build-cmd: 'npm run build'

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
